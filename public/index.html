<!DOCTYPE html>  <!-- html-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <title>AskDoc AI ChatBot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="52" height="52" focusable="false">
          <rect x="9" y="5" width="24" height="32" rx="3.5" fill="#ffffff" stroke="#2f63c4" stroke-width="2.5" />
          <path d="M27 5l6 6h-6V5z" fill="#d9e6fa" />
          <line x1="15" y1="18" x2="27" y2="18" stroke="#9db9e8" stroke-width="2.5" stroke-linecap="round" />
          <line x1="15" y1="24" x2="27" y2="24" stroke="#9db9e8" stroke-width="2.5" stroke-linecap="round" />
          <line x1="15" y1="30" x2="23" y2="30" stroke="#c3d5f2" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="33" cy="34" r="9" fill="#2e7d5c" />
          <path d="M29 34.2l2.8 2.8 5.2-5.8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="38.5" cy="9.5" r="3" fill="#e8934a" />
        </svg>
      </span>
      <h1>AskDoc AI ChatBot</h1>
      <p>Upload a PDF and ask questions about its contents.</p>
      <span class="status-pill"><span class="status-dot" aria-hidden="true"></span>Online</span>
    </header>

    <section class="card uploader" aria-label="PDF upload">
      <input type="file" id="pdf-input" accept="application/pdf" hidden />
      <button type="button" id="upload-button">Upload PDF</button>
      <span id="file-status">No PDF selected</span>
    </section>

    <section class="card chat-card" aria-label="Conversation">
      <div class="chat-toolbar">
        <span class="chat-title">Chat</span>
        <button type="button" id="clear-button">Clear chat</button>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
    </section>

    <form class="ask" id="question-form">
      <label class="visually-hidden" for="question-input">Ask a question about the PDF</label>
      <input
        type="text"
        id="question-input"
        placeholder="Type your question about the PDF…"
        autocomplete="off"
      />
      <button type="submit" id="send-button">Send</button>
    </form>

    <footer class="app-footer">Developed by Adhith V</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
